[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hs-cargo-classifier"
version = "0.1.0"
description = "Tiered HS-chapter classification of free-text cargo descriptions (lookup, then LLM, then review)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]

[project.scripts]
hsclass = "hsclass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
